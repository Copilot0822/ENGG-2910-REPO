[project]
name = "strava-speed-predictor"
version = "0.1.0"
description = "Local, personalized segment-level cycling speed and journey-time predictions"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "astral>=3.2,<4",
  "defusedxml>=0.7.1",
  "fitparse>=1.2.0",
  "gpxpy>=1.6.2",
  "joblib>=1.4",
  "numpy>=2.0",
  "osmium>=4.3.1",
  "pandas>=2.2",
  "plotly>=6.0",
  "pyarrow>=18.0",
  "pydeck>=0.9",
  "requests>=2.32",
  "scikit-learn>=1.6",
  "scipy>=1.14",
  "shapely>=2.0",
  "streamlit>=1.42",
  "timezonefinder>=7,<9",
]

[project.optional-dependencies]
pbf = ["osmium>=4.0"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[project.scripts]
cycling = "cycling.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cycling"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 105

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
